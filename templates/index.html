<!-- AI Candidate Profiler (ATS) - Flask & React Single Page Application -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Candidate Profiler (ATS)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- React and ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel CDN for JSX parsing -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 to-gray-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useCallback, useRef } = React;

        // Custom SVG components for Lucide icons (premium style matching the application)
        const Sliders = ({ className }) => (
            <svg className={className} xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                <line x1="4" y1="21" x2="4" y2="14" />
                <line x1="4" y1="10" x2="4" y2="3" />
                <line x1="12" y1="21" x2="12" y2="12" />
                <line x1="12" y1="8" x2="12" y2="3" />
                <line x1="20" y1="21" x2="20" y2="16" />
                <line x1="20" y1="12" x2="20" y2="3" />
                <line x1="2" y1="14" x2="6" y2="14" />
                <line x1="10" y1="8" x2="14" y2="8" />
                <line x1="18" y1="16" x2="22" y2="16" />
            </svg>
        );

        const UploadCloud = ({ className }) => (
            <svg className={className} xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                <path d="M16 16l-4-4-4 4M12 12v9" />
                <path d="M20.39 18.39A5 5 0 0018 9h-1.26A8 8 0 103 16.3" />
            </svg>
        );

        const ThumbsUp = ({ className }) => (
            <svg className={className} xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                <path d="M14 9V5a3 3 0 00-3-3l-4 9v11h11.28a2 2 0 002-1.7l1.38-9a2 2 0 00-2-2.3zM7 22H4a2 2 0 01-2-2v-7a2 2 0 012-2h3" />
            </svg>
        );

        const TrendingUp = ({ className }) => (
            <svg className={className} xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                <polyline points="23 6 13.5 15.5 8.5 10.5 1 18" />
                <polyline points="17 6 23 6 23 12" />
            </svg>
        );

        const Zap = ({ className }) => (
            <svg className={className} xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
            </svg>
        );

        const Loader2 = ({ className }) => (
            <svg className={`${className} animate-spin`} xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
        );

        const XCircle = ({ className }) => (
            <svg className={className} xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                <circle cx="12" cy="12" r="10" />
                <line x1="15" y1="9" x2="9" y2="15" />
                <line x1="9" y1="9" x2="15" y2="15" />
            </svg>
        );

        const FileText = ({ className }) => (
            <svg className={className} xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" />
                <polyline points="14 2 14 8 20 8" />
                <line x1="16" y1="13" x2="8" y2="13" />
                <line x1="16" y1="17" x2="8" y2="17" />
                <polyline points="10 9 9 9 8 9" />
            </svg>
        );

        const CheckCircle = ({ className }) => (
            <svg className={className} xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                <path d="M22 11.08V12a10 10 0 11-5.93-9.14" />
                <polyline points="22 4 12 14.01 9 11.01" />
            </svg>
        );

        const ArrowRight = ({ className }) => (
            <svg className={className} xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                <line x1="5" y1="12" x2="19" y2="12" />
                <polyline points="12 5 19 12 12 19" />
            </svg>
        );

        const ArrowLeft = ({ className }) => (
            <svg className={className} xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                <line x1="19" y1="12" x2="5" y2="12" />
                <polyline points="12 19 5 12 12 5" />
            </svg>
        );

        // --- Initial State and Types ---
        const initialData = {
            score: null,
            feedbackSummary: "Awaiting analysis...",
            matchedSkills: [],
            missingSkills: [],
            developmentPlan: [],
        };

        const defaultResumeText = `Jane Doe | jane.doe@procorp.com | (555) 123-4567

Summary
Highly dedicated Software Engineer with 5 years of experience specializing in scalable web application development. Proven ability to deliver robust, high-performance systems using modern JavaScript frameworks and cloud infrastructure. Seeking a Senior position.

Technical Skills
Front-end: React, Redux, TypeScript, Tailwind CSS, Webpack
Back-end: Node.js, Express, Python (Basic), REST APIs
Database: PostgreSQL, MongoDB, SQL
DevOps/Cloud: AWS (EC2, S3), Docker, Git, CI/CD, Linux

Experience
Senior Frontend Developer, TechCorp Solutions (2022 - Present)
- Led the development of a company-wide analytics dashboard using React and TypeScript, resulting in a 30% reduction in report generation time.
- Implemented a micro-frontend architecture for smoother deployments.
- Mentored junior developers on best practices in state management (Redux/Zustand).

Software Engineer, Innovate Web (2019 - 2022)
- Designed and implemented 10+ core RESTful APIs using Node.js.
- Maintained legacy Java applications and managed migration efforts.

Education
Master of Science in Computer Science, State University (2019)`;

        const initialForm = {
            jobRole: 'Senior Full Stack Developer',
            qualifications: 'Master of Science (Computer Science)',
            resumeText: '', 
            fileName: null 
        };

        // --- Shared UI Components ---
        const Card = ({ title, children, icon: Icon, className = '', titleClass = 'text-xl' }) => (
            <div className={`p-6 bg-white rounded-xl shadow-2xl border border-gray-100 transition-all duration-300 ${className}`}>
                <div className="flex items-center space-x-3 mb-4">
                    {Icon && <Icon className="w-7 h-7 text-indigo-600" />}
                    <h2 className={`${titleClass} font-extrabold text-gray-800`}>{title}</h2>
                </div>
                {children}
            </div>
        );

        const Button = ({ children, onClick, disabled, icon: Icon, className = '', variant = 'primary' }) => {
            let baseClass = 'flex items-center justify-center space-x-2 w-full px-6 py-3 font-medium rounded-lg shadow-lg transition-all duration-200';
            let variantClass = '';

            if (variant === 'primary') {
                variantClass = 'text-white bg-indigo-600 shadow-indigo-500/50 hover:bg-indigo-700 active:bg-indigo-800 hover:shadow-xl focus:ring-4 focus:ring-indigo-500/50';
            } else if (variant === 'secondary') {
                variantClass = 'text-gray-700 bg-gray-200 shadow-gray-300/50 hover:bg-gray-300 active:bg-gray-400 focus:ring-4 focus:ring-gray-400/50';
            }

            return (
                <button
                    onClick={onClick}
                    disabled={disabled}
                    className={`${baseClass} ${variantClass} ${disabled ? 'opacity-50 cursor-not-allowed' : ''} ${className}`}
                >
                    {Icon && <Icon className={`w-5 h-5 ${disabled ? 'animate-spin' : ''}`} />}
                    <span>{children}</span>
                </button>
            );
        };

        const ListSection = ({ title, items, icon: Icon, colorClass }) => (
            <div className="mt-4">
                <h3 className="text-lg font-bold flex items-center space-x-2 mb-2 text-gray-700">
                    <Icon className={`w-5 h-5 ${colorClass}`} />
                    <span>{title}</span>
                </h3>
                <ul className="list-inside space-y-3">
                    {items && items.map((item, index) => (
                        <li key={index} className="flex items-start text-sm text-gray-600">
                            <span className={`w-2 h-2 rounded-full mt-1.5 mr-3 ${colorClass.replace('text-', 'bg-')}`}></span>
                            {item}
                        </li>
                    ))}
                </ul>
            </div>
        );

        const FileDropZone = ({ onFileSelect, fileName }) => {
            const fileInputRef = useRef(null);

            const handleDrop = (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                    onFileSelect(e.dataTransfer.files[0].name);
                }
            };

            const handleClick = () => {
                fileInputRef.current.click();
            };

            const handleFileChange = (e) => {
                if (e.target.files && e.target.files[0]) {
                    onFileSelect(e.target.files[0].name);
                }
            };

            return (
                <div 
                    className="p-6 border-2 border-dashed border-indigo-300 rounded-xl text-center cursor-pointer transition duration-200 hover:border-indigo-500 hover:bg-indigo-50/50"
                    onDrop={handleDrop}
                    onDragOver={e => e.preventDefault()}
                    onDragEnter={e => e.preventDefault()}
                    onClick={handleClick}
                >
                    <input 
                        type="file" 
                        ref={fileInputRef} 
                        onChange={handleFileChange} 
                        accept=".pdf,.docx,.txt"
                        className="hidden" 
                    />
                    {fileName ? (
                        <div className="flex flex-col items-center">
                            <CheckCircle className="w-8 h-8 text-green-500 mb-2" />
                            <p className="text-sm font-semibold text-gray-800">File Selected:</p>
                            <p className="text-indigo-600 truncate max-w-full">{fileName}</p>
                        </div>
                    ) : (
                        <div className="flex flex-col items-center">
                            <UploadCloud className="w-10 h-10 text-indigo-500 mb-2" />
                            <p className="font-semibold text-gray-800">Drag & Drop Resume (PDF/Docx)</p>
                            <p className="text-xs text-gray-500 mt-1">or Click to Browse</p>
                        </div>
                    )}
                    <p className="text-xs text-red-500 mt-3">
                        *File upload is simulated. The system loads a default, rich resume text for analysis.
                    </p>
                </div>
            );
        };

        // --- Step Components ---

        // Step 1: Define Role
        const Step1DefineRole = ({ formData, handleFormChange, setStep, setError }) => {
            const handleNext = () => {
                if (!formData.jobRole.trim() || !formData.qualifications.trim()) {
                    setError("Please fill in both the Target Job Role and Highest Qualification before proceeding.");
                    return;
                }
                setError(null);
                setStep(2);
            };

            return (
                <Card title="Step 1: Define Your Target Role" icon={Sliders} titleClass='text-2xl' className="bg-white/90">
                    <p className='text-gray-600 mb-6'>Tell us which role you are applying for and your qualification level. This sets the benchmark for our AI analysis.</p>
                    <div className="space-y-6">
                        <label className="block">
                            <span className="text-sm font-medium text-gray-700">Target Job Role</span>
                            <input
                                type="text"
                                name="jobRole"
                                value={formData.jobRole}
                                onChange={handleFormChange}
                                placeholder="e.g., Lead Data Scientist"
                                className="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-3"
                            />
                        </label>
                        <label className="block">
                            <span className="text-sm font-medium text-gray-700">Highest Qualification</span>
                            <input
                                type="text"
                                name="qualifications"
                                value={formData.qualifications}
                                onChange={handleFormChange}
                                placeholder="e.g., Master's Degree"
                                className="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-3"
                            />
                        </label>
                        <Button onClick={handleNext} icon={ArrowRight}>
                            Next: Upload Resume
                        </Button>
                    </div>
                </Card>
            );
        };

        // Step 2: Upload Resume
        const Step2UploadResume = ({ formData, handleFileSelect, handleFormChange, analyzeResume, isLoading, setStep, error }) => {
            return (
                <div className='space-y-6'>
                    <Card title="Step 2: Upload & Review Resume" icon={FileText} titleClass='text-2xl' className="bg-white/90">
                        <FileDropZone onFileSelect={handleFileSelect} fileName={formData.fileName} />

                        <h3 className="text-lg font-bold text-gray-700 mt-6 mb-2 flex items-center space-x-2">
                            <FileText className='w-5 h-5 text-indigo-600'/>
                            <span>Resume Content Preview (Editable)</span>
                        </h3>
                        <textarea
                            name="resumeText"
                            value={formData.resumeText}
                            onChange={handleFormChange}
                            rows="15"
                            placeholder="Paste your resume's plain text content here, or click the upload box above to load the simulated content."
                            className="mt-1 block w-full rounded-md border-gray-300 bg-gray-50 shadow-inner focus:border-indigo-500 focus:ring-indigo-500 p-4 resize-none text-sm"
                        ></textarea>
                    </Card>

                    <div className="flex space-x-4">
                        <Button onClick={() => setStep(1)} variant="secondary" icon={ArrowLeft} className="w-1/3">
                            Back
                        </Button>
                        <Button onClick={analyzeResume} disabled={isLoading || !formData.resumeText} icon={isLoading ? Loader2 : Zap} className="w-2/3">
                            {isLoading ? 'Analyzing Profile...' : 'Analyze & Score Match'}
                        </Button>
                    </div>

                    {error && (
                        <div className="p-4 bg-red-100 border border-red-400 text-red-700 rounded-xl flex items-center space-x-3 shadow-md">
                            <XCircle className="w-6 h-6" />
                            <p className="text-sm font-medium">{error}</p>
                        </div>
                    )}
                </div>
            );
        };

        // Step 3: Analysis Results
        const Step3Results = ({ analysisResult, setStep }) => {
            const isAnalyzed = analysisResult.score !== null;
            const score = analysisResult.score || 0;
            
            let scoreColor, scoreRating;
            if (score >= 85) {
                scoreColor = 'from-green-500 to-green-600';
                scoreRating = 'Excellent Match';
            } else if (score >= 60) {
                scoreColor = 'from-yellow-500 to-yellow-600';
                scoreRating = 'Good Potential';
            } else {
                scoreColor = 'from-red-500 to-red-600';
                scoreRating = 'Low Match';
            }
            const scoreRingColor = score >= 85 ? 'ring-green-400' : score >= 60 ? 'ring-yellow-400' : 'ring-red-400';

            return (
                <div className="w-full space-y-8">
                    <Card title="Recruitment Score & Summary" icon={TrendingUp} titleClass='text-3xl' className="!p-8">
                        <div className="flex flex-col md:flex-row items-center space-y-6 md:space-y-0 md:space-x-8">
                            {/* Score Circle */}
                            <div className={`relative w-36 h-36 flex items-center justify-center rounded-full bg-gradient-to-br ${scoreColor} shadow-xl ring-8 ${scoreRingColor} flex-shrink-0`}>
                                <div className="text-white font-extrabold text-5xl">
                                    {isAnalyzed ? `${score}%` : '--'}
                                </div>
                            </div>
                            {/* Summary */}
                            <div className="flex-1 text-center md:text-left">
                                <h3 className="text-3xl font-extrabold text-gray-900 mb-2">{scoreRating}</h3>
                                <p className="text-gray-600 leading-relaxed">
                                    {analysisResult.feedbackSummary}
                                </p>
                            </div>
                        </div>
                    </Card>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        <div className='lg:col-span-2 space-y-8'>
                            <Card title="Skill Alignment" icon={ThumbsUp}>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-8">
                                    <ListSection
                                        title="Recruitment Match (Strengths)"
                                        items={analysisResult.matchedSkills}
                                        icon={CheckCircle}
                                        colorClass="text-green-600"
                                    />
                                    <ListSection
                                        title="Gaps for Role (Areas to Improve)"
                                        items={analysisResult.missingSkills}
                                        icon={XCircle}
                                        colorClass="text-red-600"
                                    />
                                </div>
                            </Card>
                        </div>
                        
                        <Card title="Personalized Career Roadmap" icon={TrendingUp} className="bg-blue-50/50 lg:col-span-1">
                            <p className="text-gray-600 mb-4 font-semibold text-sm">
                                Actionable plan to enhance your profile for future recruitment:
                            </p>
                            <ol className="space-y-4">
                                {analysisResult.developmentPlan && analysisResult.developmentPlan.map((step, index) => (
                                    <li key={index} className="flex items-start text-base text-gray-700">
                                        <span className="w-6 h-6 flex items-center justify-center bg-indigo-500 text-white rounded-full flex-shrink-0 mr-3 text-sm font-bold shadow-md">
                                            {index + 1}
                                        </span>
                                        {step}
                                    </li>
                                ))}
                            </ol>
                        </Card>
                    </div>
                    
                    <div className="flex justify-center">
                        <Button onClick={() => setStep(1)} variant="secondary" className="!w-64">
                            Start New Analysis
                        </Button>
                    </div>
                </div>
            );
        };

        // --- Main Application Component ---
        const App = () => {
            const [formData, setFormData] = useState(initialForm);
            const [analysisResult, setAnalysisResult] = useState(initialData);
            const [isLoading, setIsLoading] = useState(false);
            const [error, setError] = useState(null);
            const [step, setStep] = useState(1);

            const handleFormChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
                setAnalysisResult(initialData); 
                setError(null);
            };

            const handleFileSelect = (name) => {
                setFormData(prev => ({ 
                    ...prev, 
                    fileName: name,
                    resumeText: defaultResumeText
                }));
                setAnalysisResult(initialData);
                setError(null);
            };

            const analyzeResume = useCallback(async () => {
                if (!formData.resumeText.trim() || !formData.jobRole.trim()) {
                    setError("Analysis cannot proceed. Please define the job role and ensure resume content is present.");
                    return;
                }

                setIsLoading(true);
                setError(null);
                setAnalysisResult(initialData);

                try {
                    const formDataToSend = new FormData();
                    formDataToSend.append("resume_text", formData.resumeText);
                    formDataToSend.append("job_description", `Target Job Role: ${formData.jobRole}\nQualification Level: ${formData.qualifications}`);

                    const response = await fetch('/analyze', {
                        method: 'POST',
                        body: formDataToSend
                    });

                    const result = await response.json();

                    if (!response.ok) {
                        throw new Error(result.error || "Analysis failed on the server.");
                    }

                    setAnalysisResult(result);
                    setStep(3);
                } catch (err) {
                    setError(`An error occurred during communication with the local server: ${err.message}.`);
                    console.error(err);
                } finally {
                    setIsLoading(false);
                }
            }, [formData]);

            const steps = [
                { label: "Define Role" },
                { label: "Upload Resume" },
                { label: "View Analysis" },
            ];

            return (
                <div className="min-h-screen p-4 sm:p-8">
                    <header className="text-center mb-10">
                        <h1 className="text-5xl font-extrabold text-gray-900 flex items-center justify-center space-x-4">
                            <Sliders className="w-10 h-10 text-indigo-600" />
                            <span className="bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-purple-600">
                                AI Candidate Profiler (ATS)
                            </span>
                        </h1>
                        <p className="text-gray-500 mt-3 text-xl">The intelligent way to match skills to career opportunities.</p>
                    </header>

                    <main className="max-w-7xl mx-auto">
                        {/* Step Indicator Bar */}
                        <div className="flex justify-center mb-10">
                            {steps.map((s, index) => (
                                <div key={index} className="flex items-center">
                                    <div className={`w-10 h-10 rounded-full flex items-center justify-center text-white font-bold text-lg transition-all duration-300
                                        ${step === index + 1 ? 'bg-indigo-600 shadow-lg shadow-indigo-500/50' : step > index + 1 ? 'bg-green-500' : 'bg-gray-300'}`}>
                                        {step > index + 1 ? <CheckCircle className='w-5 h-5'/> : index + 1}
                                    </div>
                                    <span className={`ml-3 mr-6 text-sm font-semibold hidden sm:inline ${step === index + 1 ? 'text-indigo-700' : 'text-gray-500'}`}>
                                        {s.label}
                                    </span>
                                    {index < steps.length - 1 && (
                                        <div className={`h-1 w-16 transition-all duration-300 ${step > index + 1 ? 'bg-green-500' : 'bg-gray-300'}`}></div>
                                    )}
                                </div>
                            ))}
                        </div>

                        {/* Dynamic Content Area */}
                        <div className="w-full flex justify-center">
                            {step === 1 && (
                                <div className='w-full max-w-lg'>
                                    <Step1DefineRole 
                                        formData={formData} 
                                        handleFormChange={handleFormChange} 
                                        setStep={setStep} 
                                        setError={setError}
                                    />
                                </div>
                            )}

                            {step === 2 && (
                                 <div className='w-full max-w-4xl'>
                                    <Step2UploadResume 
                                        formData={formData} 
                                        handleFileSelect={handleFileSelect} 
                                        handleFormChange={handleFormChange} 
                                        analyzeResume={analyzeResume} 
                                        isLoading={isLoading} 
                                        setStep={setStep}
                                        error={error}
                                    />
                                </div>
                            )}
                            
                            {step === 3 && (
                                <Step3Results 
                                    analysisResult={analysisResult} 
                                    setStep={setStep} 
                                />
                            )}
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
